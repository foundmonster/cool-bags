# Netlify Configuration
# This file tells Netlify how to build and deploy your site

[build]
  # No build command needed - pure HTML site
  publish = "."

  # Netlify Functions directory
  functions = "netlify/functions"

# Branch deploy settings - only deploy main branch to production
[context.production]
  # Production builds from main branch only
  command = "echo 'Production deployment from main branch'"

[context.dev]
  # Dev branch builds but doesn't deploy to production
  command = "echo 'Development branch - no production deployment'"

# Environment variables needed (add in Netlify dashboard).
# These are every variable netlify/functions/create-issue.js reads:
# GITHUB_TOKEN - GitHub Personal Access Token, opens issues on foundmonster/cool-bags (required)
# MAILGUN_API_KEY - Mailgun private API key; if unset, the brand-request confirmation email is skipped
# MAILGUN_DOMAIN - Mailgun sending domain, e.g. mg.coolbags.info; required whenever MAILGUN_API_KEY is set
#
# BUTTONDOWN_API_KEY - not read by any function here. It is a GitHub Actions repository secret
# used by .github/workflows/notify-brand-added.yml. It is also present as a Netlify project
# variable, where nothing consumes it.

# Redirect rules (if needed later)
# [[redirects]]
#   from = "/api/*"
#   to = "/.netlify/functions/:splat"
#   status = 200
